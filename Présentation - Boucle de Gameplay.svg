<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0a0a"/>
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#00ffff" font-size="28" font-weight="bold" font-family="Arial">
    BOUCLE DE GAMEPLAY - PACKET RUNNER
  </text>
  <text x="600" y="65" text-anchor="middle" fill="#606060" font-size="14" font-family="Arial">
    Du menu à la victoire : cycle complet d'une partie
  </text>
  
  <!-- PHASE 1: MENU -->
  <rect x="50" y="120" width="200" height="100" fill="#1a1a1a" stroke="#00ffff" stroke-width="2" rx="10"/>
  <text x="150" y="155" text-anchor="middle" fill="#00ffff" font-size="16" font-weight="bold" font-family="Arial">
    MENU PRINCIPAL
  </text>
  <text x="150" y="180" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    • Nouvelle Route
  </text>
  <text x="150" y="200" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    • Tutoriel
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 250 170 L 320 170" stroke="#00ffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00ffff"/>
    </marker>
  </defs>
  
  <!-- PHASE 2: BRIEFING -->
  <rect x="320" y="120" width="200" height="100" fill="#1a1a1a" stroke="#00ff88" stroke-width="2" rx="10"/>
  <text x="420" y="155" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold" font-family="Arial">
    BRIEFING
  </text>
  <text x="420" y="180" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    Source: Paris
  </text>
  <text x="420" y="200" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    Destination: Tokyo
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 520 170 L 590 170" stroke="#00ff88" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00ff88"/>
    </marker>
  </defs>
  
  <!-- PHASE 3: SPAWN -->
  <rect x="590" y="120" width="200" height="100" fill="#1a1a1a" stroke="#ffaa00" stroke-width="2" rx="10"/>
  <text x="690" y="155" text-anchor="middle" fill="#ffaa00" font-size="16" font-weight="bold" font-family="Arial">
    SPAWN
  </text>
  <text x="690" y="180" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    TTL: 64
  </text>
  <text x="690" y="200" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="Arial">
    Premier routeur
  </text>
  
  <!-- Arrow down -->
  <path d="M 690 220 L 690 280" stroke="#ffaa00" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffaa00"/>
    </marker>
  </defs>
  
  <!-- PHASE 4: GAMEPLAY LOOP (Center) -->
  <rect x="490" y="280" width="400" height="280" fill="#1a1a1a" stroke="#ff00ff" stroke-width="3" rx="10"/>
  <text x="690" y="310" text-anchor="middle" fill="#ff00ff" font-size="18" font-weight="bold" font-family="Arial">
    BOUCLE DE GAMEPLAY
  </text>
  
  <!-- Sub-phases in gameplay -->
  <!-- Observation -->
  <circle cx="560" cy="370" r="40" fill="#2a2a2a" stroke="#00ffff" stroke-width="2"/>
  <text x="560" y="365" text-anchor="middle" fill="#00ffff" font-size="11" font-weight="bold" font-family="Arial">
    OBSERVER
  </text>
  <text x="560" y="380" text-anchor="middle" fill="#aaaaaa" font-size="9" font-family="Arial">
    les routes
  </text>
  
  <!-- Decision -->
  <circle cx="690" cy="340" r="40" fill="#2a2a2a" stroke="#ffaa00" stroke-width="2"/>
  <text x="690" y="335" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold" font-family="Arial">
    DÉCIDER
  </text>
  <text x="690" y="350" text-anchor="middle" fill="#aaaaaa" font-size="9" font-family="Arial">
    quel routeur
  </text>
  
  <!-- Action -->
  <circle cx="820" cy="370" r="40" fill="#2a2a2a" stroke="#00ff88" stroke-width="2"/>
  <text x="820" y="365" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold" font-family="Arial">
    SAUTER
  </text>
  <text x="820" y="380" text-anchor="middle" fill="#aaaaaa" font-size="9" font-family="Arial">
    vers routeur
  </text>
  
  <!-- Resources -->
  <circle cx="820" cy="480" r="40" fill="#2a2a2a" stroke="#ff3344" stroke-width="2"/>
  <text x="820" y="475" text-anchor="middle" fill="#ff3344" font-size="11" font-weight="bold" font-family="Arial">
    GÉRER
  </text>
  <text x="820" y="490" text-anchor="middle" fill="#aaaaaa" font-size="9" font-family="Arial">
    ressources
  </text>
  
  <!-- Repeat -->
  <circle cx="560" cy="480" r="40" fill="#2a2a2a" stroke="#0099ff" stroke-width="2"/>
  <text x="560" y="475" text-anchor="middle" fill="#0099ff" font-size="11" font-weight="bold" font-family="Arial">
    RÉPÉTER
  </text>
  <text x="560" y="490" text-anchor="middle" fill="#aaaaaa" font-size="9" font-family="Arial">
    ou sortir
  </text>
  
  <!-- Arrows between circles -->
  <path d="M 595 360 L 655 345" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 725 350 L 785 360" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 820 410 L 820 440" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 785 490 L 595 490" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 560 440 L 560 410" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Resources display -->
  <rect x="510" y="420" width="160" height="70" fill="#0a0a0a" stroke="#333333" stroke-width="1" rx="5"/>
  <text x="590" y="438" text-anchor="middle" fill="#00ff88" font-size="10" font-family="Arial">TTL: 64 → 0</text>
  <text x="590" y="453" text-anchor="middle" fill="#ffaa00" font-size="10" font-family="Arial">Latence: 0 → 500ms</text>
  <text x="590" y="468" text-anchor="middle" fill="#ff3344" font-size="10" font-family="Arial">Énergie: 0 → ∞W</text>
  <text x="590" y="483" text-anchor="middle" fill="#606060" font-size="9" font-family="Arial" font-style="italic">en temps réel</text>
  
  <!-- Arrow to victory -->
  <path d="M 690 560 L 690 620" stroke="#00ff88" stroke-width="2" fill="none" marker-end="url(#arrowhead4)"/>
  <defs>
    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00ff88"/>
    </marker>
  </defs>
  <text x="720" y="595" fill="#00ff88" font-size="12" font-family="Arial">Destination</text>
  <text x="720" y="610" fill="#00ff88" font-size="12" font-family="Arial">atteinte</text>
  
  <!-- Arrow to game over -->
  <path d="M 490 420 L 380 420 L 380 650 L 440 650" stroke="#ff3344" stroke-width="2" fill="none" marker-end="url(#arrowhead5)" stroke-dasharray="5,5"/>
  <defs>
    <marker id="arrowhead5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff3344"/>
    </marker>
  </defs>
  <text x="320" y="420" fill="#ff3344" font-size="11" font-family="Arial">TTL = 0</text>
  
  <!-- PHASE 5: VICTORY -->
  <rect x="590" y="620" width="200" height="120" fill="#1a1a1a" stroke="#00ff88" stroke-width="3" rx="10"/>
  <text x="690" y="650" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold" font-family="Arial">
    ✓ VICTOIRE
  </text>
  <text x="690" y="675" text-anchor="middle" fill="#aaaaaa" font-size="11" font-family="Arial">
    Statistiques:
  </text>
  <text x="690" y="695" text-anchor="middle" fill="#00ff88" font-size="10" font-family="Arial">
    • Hops: 12/64
  </text>
  <text x="690" y="710" text-anchor="middle" fill="#ffaa00" font-size="10" font-family="Arial">
    • Latence: 142ms
  </text>
  <text x="690" y="725" text-anchor="middle" fill="#ff3344" font-size="10" font-family="Arial">
    • CO2: 0.18g (Grade A)
  </text>
  
  <!-- PHASE 6: GAME OVER -->
  <rect x="440" y="620" width="120" height="120" fill="#1a1a1a" stroke="#ff3344" stroke-width="3" rx="10"/>
  <text x="500" y="650" text-anchor="middle" fill="#ff3344" font-size="16" font-weight="bold" font-family="Arial">
    ✗ ÉCHEC
  </text>
  <text x="500" y="680" text-anchor="middle" fill="#aaaaaa" font-size="11" font-family="Arial">
    Paquet perdu
  </text>
  <text x="500" y="700" text-anchor="middle" fill="#ff3344" font-size="10" font-family="Arial">
    TTL expiré
  </text>
  <text x="500" y="720" text-anchor="middle" fill="#606060" font-size="9" font-family="Arial" font-style="italic">
    après 42 hops
  </text>
  
  <!-- Return arrows -->
  <path d="M 690 740 L 690 760 L 150 760 L 150 220" stroke="#0099ff" stroke-width="2" fill="none" marker-end="url(#arrowhead6)" stroke-dasharray="3,3"/>
  <path d="M 500 740 L 500 760 L 150 760 L 150 220" stroke="#0099ff" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <defs>
    <marker id="arrowhead6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0099ff"/>
    </marker>
  </defs>
  <text x="300" y="775" fill="#0099ff" font-size="10" font-family="Arial">Rejouer / Menu</text>
  
  <!-- LEGEND -->
  <rect x="930" y="120" width="220" height="280" fill="#1a1a1a" stroke="#606060" stroke-width="1" rx="5"/>
  <text x="1040" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Arial">
    LÉGENDE
  </text>
  
  <!-- Legend items -->
  <rect x="950" y="165" width="15" height="15" fill="none" stroke="#00ffff" stroke-width="2"/>
  <text x="975" y="177" fill="#aaaaaa" font-size="11" font-family="Arial">Phase Menu</text>
  
  <rect x="950" y="190" width="15" height="15" fill="none" stroke="#00ff88" stroke-width="2"/>
  <text x="975" y="202" fill="#aaaaaa" font-size="11" font-family="Arial">Phase Setup</text>
  
  <rect x="950" y="215" width="15" height="15" fill="none" stroke="#ff00ff" stroke-width="2"/>
  <text x="975" y="227" fill="#aaaaaa" font-size="11" font-family="Arial">Boucle principale</text>
  
  <rect x="950" y="240" width="15" height="15" fill="none" stroke="#00ff88" stroke-width="3"/>
  <text x="975" y="252" fill="#aaaaaa" font-size="11" font-family="Arial">Victoire</text>
  
  <rect x="950" y="265" width="15" height="15" fill="none" stroke="#ff3344" stroke-width="3"/>
  <text x="975" y="277" fill="#aaaaaa" font-size="11" font-family="Arial">Échec</text>
  
  <line x1="950" y1="295" x2="965" y2="295" stroke="#0099ff" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="975" y="300" fill="#aaaaaa" font-size="11" font-family="Arial">Retour menu</text>
  
  <text x="1040" y="330" text-anchor="middle" fill="#606060" font-size="10" font-family="Arial" font-style="italic">
    Temps moyen:
  </text>
  <text x="1040" y="345" text-anchor="middle" fill="#606060" font-size="10" font-family="Arial" font-style="italic">
    2-5 minutes/partie
  </text>
  
  <!-- KEY METRICS -->
  <rect x="930" y="420" width="220" height="140" fill="#1a1a1a" stroke="#606060" stroke-width="1" rx="5"/>
  <text x="1040" y="445" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Arial">
    RESSOURCES CLÉS
  </text>
  
  <circle cx="960" cy="470" r="5" fill="#00ff88"/>
  <text x="975" y="475" fill="#00ff88" font-size="11" font-family="Arial">TTL (Time To Live)</text>
  <text x="975" y="490" fill="#606060" font-size="9" font-family="Arial">Nombre de sauts max</text>
  
  <circle cx="960" cy="510" r="5" fill="#ffaa00"/>
  <text x="975" y="515" fill="#ffaa00" font-size="11" font-family="Arial">Latence (ms)</text>
  <text x="975" y="530" fill="#606060" font-size="9" font-family="Arial">Délai accumulé</text>
  
  <circle cx="960" cy="545" r="5" fill="#ff3344"/>
  <text x="975" y="550" fill="#ff3344" font-size="11" font-family="Arial">Énergie (Watts)</text>
  <text x="975" y="565" fill="#606060" font-size="9" font-family="Arial">Consommation CO2</text>
  
  <!-- Footer -->
  <text x="600" y="790" text-anchor="middle" fill="#606060" font-size="10" font-family="Arial" font-style="italic">
    Packet Runner - GREEN IT GAME Challenge - Unity 6.X
  </text>
</svg>